<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商小二 · AI 客服</title>
<style>
  :root{
    /* 品牌 */
    --brand-50:#fff7ed; --brand-100:#ffedd5; --brand-200:#fed7aa;
    --brand-400:#fb923c; --brand-500:#f97316; --brand-600:#ea580c; --brand-700:#c2410c;
    /* 中性 */
    --ink-900:#1c1917; --ink-700:#44403c; --ink-500:#78716c; --ink-400:#a8a29e; --ink-300:#d6d3d1;
    --line:#ebe9e6; --line-soft:#f3f1ee;
    --surface:#ffffff; --bg:#fbfaf9;
    /* 语义 */
    --ok:#047857; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
    --info:#1d4ed8; --info-bg:#eff6ff; --info-line:#bfdbfe;
    --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fde68a;
    /* 尺寸 */
    --r-md:12px; --r-lg:16px;
    --shadow-1:0 1px 2px rgba(28,25,23,.04);
    --shadow-2:0 2px 6px rgba(28,25,23,.05), 0 12px 28px -18px rgba(28,25,23,.18);
    --shadow-brand:0 2px 8px -2px rgba(234,88,12,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.65; color:var(--ink-900);
    background:
      radial-gradient(1100px 520px at 12% -12%, #fff3e6 0%, rgba(255,243,230,0) 62%),
      radial-gradient(900px 460px at 104% -6%, #f4f4f2 0%, rgba(244,244,242,0) 55%),
      var(--bg);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  /* ══ 顶栏 ══ */
  header{
    flex:0 0 64px; display:flex; align-items:center; gap:12px; padding:0 22px;
    background:rgba(255,255,255,.78); backdrop-filter:blur(14px) saturate(1.4);
    border-bottom:1px solid var(--line); position:relative; z-index:10;
  }
  .logo{
    width:34px;height:34px;border-radius:11px;flex:0 0 34px;
    background:linear-gradient(140deg,#fdba74 0%,#f97316 46%,#ea580c 100%);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px;
    box-shadow:var(--shadow-brand), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .brand{display:flex;align-items:baseline;gap:8px;min-width:0}
  .brand h1{font-size:15px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
  .brand .tag{
    font-size:11px;font-weight:500;color:var(--brand-700);background:var(--brand-50);
    border:1px solid var(--brand-100);padding:1px 7px;border-radius:999px;white-space:nowrap;
  }
  .spacer{flex:1}

  .pill{
    display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;
    border-radius:999px;border:1px solid var(--line);background:var(--surface);
    font-size:12px;color:var(--ink-500);box-shadow:var(--shadow-1);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.14)}

  .user-pick{position:relative;display:flex;align-items:center}
  .user-pick::after{
    content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;pointer-events:none;
    border-right:1.6px solid var(--ink-400);border-bottom:1.6px solid var(--ink-400);
    transform:translateY(-70%) rotate(45deg);
  }
  .user-pick select{
    appearance:none;-webkit-appearance:none;
    font:inherit;font-size:13px;font-weight:500;color:var(--ink-700);
    height:32px;padding:0 30px 0 12px;border:1px solid var(--line);border-radius:9px;
    background:var(--surface);cursor:pointer;outline:none;box-shadow:var(--shadow-1);
    transition:border-color .15s, box-shadow .15s;
  }
  .user-pick select:hover{border-color:var(--ink-300)}
  .user-pick select:focus{border-color:var(--brand-400);box-shadow:0 0 0 3px rgba(249,115,22,.12)}

  /* ══ 主体 ══ */
  main{flex:1;display:flex;min-height:0}

  /* ── 聊天区 ── */
  /* min-height:0 是必须的：窄屏 main 变纵向 flex 后，缺了它 chat 会被消息内容撑高，
     整个页面跟着滚，顶栏就被顶出视野（桌面横向布局下不会暴露）。 */
  .chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .msgs{flex:1;overflow-y:auto;padding:26px 30px 8px;scroll-behavior:smooth}
  .msgs::-webkit-scrollbar{width:8px}
  .msgs::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:2px solid transparent;background-clip:content-box}
  .msgs:hover::-webkit-scrollbar-thumb{background:#dcd9d5;background-clip:content-box}

  .row{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;animation:rise .22s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row.me{flex-direction:row-reverse}

  .avatar{
    width:30px;height:30px;flex:0 0 30px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:700;letter-spacing:.3px;color:#fff;
    margin-top:1px;user-select:none;
  }
  .row.bot .avatar{background:linear-gradient(140deg,#78716c,#292524);box-shadow:0 2px 6px -2px rgba(41,37,36,.5)}
  .row.me .avatar{background:linear-gradient(140deg,#fdba74,#ea580c);box-shadow:var(--shadow-brand)}

  .bubble{
    max-width:min(600px,70%);padding:11px 15px;border-radius:15px;
    white-space:pre-wrap;word-break:break-word;
    font-size:14px;line-height:1.68;
  }
  .row.bot .bubble{
    background:var(--surface);border:1px solid var(--line);border-top-left-radius:5px;
    box-shadow:var(--shadow-1);
  }
  .row.me .bubble{
    background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;border-top-right-radius:5px;
    box-shadow:var(--shadow-brand);
  }
  .bubble .obj-tag{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;
    padding:2px 9px;border-radius:7px;background:var(--brand-50);color:var(--brand-700);
    border:1px solid var(--brand-100);margin-bottom:7px;
  }
  .row.me .obj-tag{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.38);font-weight:600}

  /* 打字中 */
  .typing{display:flex;gap:4px;padding:5px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-300);animation:blink 1.25s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}

  /* ── 空状态 ── */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;text-align:center;padding:24px 20px 70px;animation:rise .3s ease}
  .welcome-icon{
    width:56px;height:56px;border-radius:18px;margin-bottom:18px;
    background:linear-gradient(140deg,#fdba74,#ea580c);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px -10px rgba(234,88,12,.55), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .welcome-icon svg{width:28px;height:28px}
  .empty h2{font-size:19px;font-weight:650;letter-spacing:.2px;margin-bottom:6px}
  .empty p{font-size:13px;color:var(--ink-500);max-width:420px;margin-bottom:26px}
  .caps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
  .cap{
    display:flex;align-items:center;gap:11px;text-align:left;
    padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
    cursor:pointer;transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s, border-color .16s;
    box-shadow:var(--shadow-1);
  }
  .cap:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--brand-200)}
  .cap:active{transform:translateY(0)}
  .cap .ico{
    width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--brand-50);border:1px solid var(--brand-100);
  }
  .cap .ico svg{width:17px;height:17px;stroke:var(--brand-600);fill:none}
  .cap .txt{min-width:0}
  .cap .txt strong{display:block;font-size:13.5px;font-weight:600;color:var(--ink-900);line-height:1.4}
  .cap .txt em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-400);line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── 输入区 ── */
  .composer{padding:10px 26px 16px;flex:0 0 auto}
  .chips{display:none;gap:7px;flex-wrap:wrap;margin-bottom:10px;padding-left:2px}
  body.has-msgs .chips{display:flex}
  .chip{
    font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--ink-500);
    transition:.15s;white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand-200);color:var(--brand-700);background:var(--brand-50)}

  .composer-box{
    display:flex;align-items:flex-end;gap:9px;padding:7px 7px 7px 15px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow-2);transition:border-color .16s, box-shadow .16s;
  }
  .composer-box.focused{border-color:var(--brand-400);box-shadow:0 0 0 4px rgba(249,115,22,.1), var(--shadow-2)}
  textarea{
    flex:1;resize:none;border:none;outline:none;background:transparent;
    font:inherit;font-size:14px;line-height:1.6;color:var(--ink-900);
    padding:7px 0;max-height:132px;min-height:26px;
  }
  textarea::placeholder{color:var(--ink-400)}
  .send{
    flex:0 0 auto;width:40px;height:40px;border:none;border-radius:11px;cursor:pointer;
    background:linear-gradient(140deg,#fb923c,#ea580c);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-brand);transition:.16s;
  }
  .send svg{width:17px;height:17px;stroke:#fff;fill:none}
  .send:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.04)}
  .send:active:not(:disabled){transform:translateY(0) scale(.97)}
  .send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;filter:grayscale(.2)}
  .hint{font-size:11px;color:var(--ink-400);margin-top:9px;padding-left:4px}

  /* ── 对象区 ── */
  .side{
    flex:0 0 360px;display:flex;flex-direction:column;min-height:0;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border-left:1px solid var(--line);
  }
  .side-head{padding:15px 18px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-soft)}
  .side-head h2{font-size:13px;font-weight:600;color:var(--ink-700);letter-spacing:.2px}
  .count{
    font-size:11px;font-weight:600;color:var(--ink-500);background:var(--line-soft);
    padding:0 7px;height:18px;line-height:18px;border-radius:999px;
  }
  .side-body{flex:1;overflow-y:auto;padding:14px 16px 26px}
  .side-body::-webkit-scrollbar{width:8px}
  .side-body::-webkit-scrollbar-thumb{background:#e2dfdb;border-radius:99px;border:2px solid transparent;background-clip:content-box}

  .group-title{
    display:flex;align-items:center;gap:7px;
    font-size:11px;font-weight:600;color:var(--ink-400);letter-spacing:.8px;
    margin:16px 2px 9px;
  }
  .group-title:first-child{margin-top:2px}
  .group-title::after{content:"";flex:1;height:1px;background:var(--line-soft)}

  .obj-card{
    display:grid;grid-template-columns:42px minmax(0,1fr);gap:11px;align-items:center;
    padding:12px;margin-bottom:9px;border:1px solid var(--line);border-radius:var(--r-md);
    background:var(--surface);cursor:pointer;
    transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s, border-color .16s;
    box-shadow:var(--shadow-1);
  }
  .obj-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--brand-200)}
  .obj-card:active{transform:translateY(0)}

  .thumb{
    width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:650;letter-spacing:.5px;user-select:none;
    box-shadow:inset 0 0 0 1px rgba(28,25,23,.05);
  }
  .obj-main{min-width:0}
  .obj-line{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .obj-name{
    font-size:13px;font-weight:600;color:var(--ink-900);line-height:1.45;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;
  }
  .badge{flex:0 0 auto;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:6px;letter-spacing:.2px}
  .b-info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-line)}
  .b-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
  .b-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
  .b-gray{background:#f5f5f4;color:var(--ink-500);border:1px solid var(--line)}

  .obj-meta{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--ink-400);min-width:0}
  .obj-meta .price{color:var(--brand-700);font-weight:650;font-size:12.5px;font-variant-numeric:tabular-nums}
  .obj-meta .no{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .obj-desc{
    grid-column:1 / -1;font-size:11.5px;color:var(--ink-500);line-height:1.55;margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .obj-cta{
    grid-column:1 / -1;display:inline-flex;align-items:center;gap:4px;
    font-size:11px;color:var(--brand-600);margin-top:1px;opacity:0;transition:opacity .16s;
  }
  .obj-card:hover .obj-cta{opacity:1}
  .obj-cta svg{width:11px;height:11px;stroke:var(--brand-600);fill:none}

  .side-empty{text-align:center;color:var(--ink-400);font-size:12.5px;padding:34px 10px;line-height:1.9}

  /* 骨架屏 */
  .skel{height:66px;border-radius:var(--r-md);margin-bottom:9px;
    background:linear-gradient(100deg,#f4f2ef 30%,#faf9f7 50%,#f4f2ef 70%);
    background-size:220% 100%;animation:shimmer 1.3s infinite linear}
  @keyframes shimmer{to{background-position:-120% 0}}

  /* ══ 响应式 ══ */
  @media (max-width:1024px){
    .side{flex:0 0 320px}
    .bubble{max-width:min(560px,76%)}
  }
  @media (max-width:820px){
    main{flex-direction:column}
    .side{flex:0 0 auto;max-height:36vh;border-left:none;border-top:1px solid var(--line)}
    .msgs{padding:18px 16px 6px}
    .composer{padding:8px 14px 12px}
    .bubble{max-width:84%}
    .caps{grid-template-columns:1fr;max-width:400px}
    header{padding:0 14px;gap:9px}
    .pill{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="logo">小</div>
  <div class="brand">
    <h1>电商小二</h1>
    <span class="tag">AI 智能客服</span>
  </div>
  <div class="spacer"></div>
  <div class="pill"><span class="dot"></span><span id="modelTag">规则引擎</span></div>
  <div class="user-pick">
    <select id="userSel" aria-label="切换当前用户"></select>
  </div>
</header>

<main>
  <section class="chat">
    <div class="msgs" id="msgs"></div>

    <div class="composer">
      <div class="chips" id="chips"></div>
      <div class="composer-box" id="composerBox">
        <textarea id="input" rows="1" placeholder="说说你想办的事，回车发送"></textarea>
        <button class="send" id="sendBtn" aria-label="发送">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>
          </svg>
        </button>
      </div>
      <div class="hint">Shift + 回车换行 · 点右侧订单或商品卡片，可直接把它发给客服作为上下文</div>
    </div>
  </section>

  <aside class="side">
    <div class="side-head">
      <h2>我的订单与商品</h2>
      <span class="count" id="objCount">0</span>
    </div>
    <div class="side-body" id="sideBody">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
  </aside>
</main>

<!-- 空状态模板：历史为空或切换用户后复用，避免两份 HTML 漂移 -->
<template id="tplWelcome">
  <div class="empty" id="emptyTip">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </div>
    <h2>有什么可以帮你的？</h2>
    <p>查订单、查物流、看商品、申请退款，直接问我就行。</p>
    <div class="caps">
      <button class="cap" data-q="帮我查下订单状态">
        <span class="ico"><svg viewBox="0 0 24 24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
        <span class="txt"><strong>查订单状态</strong><em>订单处理到哪一步了</em></span>
      </button>
      <button class="cap" data-q="我的快递到哪了">
        <span class="ico"><svg viewBox="0 0 24 24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h13v13H1z"/><path d="M14 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/></svg></span>
        <span class="txt"><strong>查物流</strong><em>快递到哪了、几点送</em></span>
      </button>
      <button class="cap" data-q="我要申请退款">
        <span class="ico"><svg viewBox="0 0 24 24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 2 5.7"/><path d="M3 4v6h6"/></svg></span>
        <span class="txt"><strong>申请退款</strong><em>提交订单号和退款原因</em></span>
      </button>
      <button class="cap" data-q="退款多久能到账">
        <span class="ico"><svg viewBox="0 0 24 24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.3c-.7.4-1.1 1-1.1 1.8"/><path d="M12 17h.01"/></svg></span>
        <span class="txt"><strong>售后政策</strong><em>退款到账、七天无理由</em></span>
      </button>
    </div>
  </div>
</template>

<script>
// 客服后端与前端同源（由 app.py 托管本页）；电商中台是独立服务
const API = "";
const COMMERCE = "http://127.0.0.1:18081";

const QUICK = [
  "帮我查下订单状态",
  "我的快递到哪了",
  "我要申请退款",
  "退款多久能到账",
  "支持七天无理由吗",
];

// 品类/状态 → 缩略图配色（没有真实图片，用色块 + 首字，比灰框好看也不假装有图）
const CAT_COLORS = {
  "服饰": ["#fff7ed", "#fed7aa", "#c2410c"],
  "鞋靴": ["#eff6ff", "#bfdbfe", "#1d4ed8"],
};
const STATUS_COLORS = {
  pending:    ["#fffbeb", "#fde68a", "#b45309"],
  paid:       ["#fffbeb", "#fde68a", "#b45309"],
  shipped:    ["#eff6ff", "#bfdbfe", "#1d4ed8"],
  in_transit: ["#eff6ff", "#bfdbfe", "#1d4ed8"],
  delivered:  ["#ecfdf5", "#a7f3d0", "#047857"],
  completed:  ["#ecfdf5", "#a7f3d0", "#047857"],
};

let senderId = "u1001";
let busy = false;

const $ = (id) => document.getElementById(id);
const msgs = $("msgs"), input = $("input"), sendBtn = $("sendBtn");

function scrollBottom() { msgs.scrollTop = msgs.scrollHeight; }

// 空状态：克隆模板 → 挂事件，只维护一份 HTML
function renderWelcome() {
  const tpl = $("tplWelcome");
  msgs.innerHTML = "";
  msgs.appendChild(tpl.content.cloneNode(true));
  document.body.classList.remove("has-msgs");
  document.querySelectorAll(".cap").forEach((el) => {
    el.onclick = () => send(el.dataset.q, null);
  });
}

function clearEmpty() {
  const tip = $("emptyTip");
  if (tip) tip.remove();
  document.body.classList.add("has-msgs");
}

function objectLabel(obj) {
  if (!obj) return "";
  const kind = obj.type === "order" ? "订单" : obj.type === "product" ? "商品" : obj.type;
  return `${kind} ${obj.title || obj.id}`;
}

function appendMessage(role, text, obj) {
  clearEmpty();
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "me" : "bot");

  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = role === "user" ? "我" : "AI";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (obj) {
    const tag = document.createElement("div");
    tag.className = "obj-tag";
    tag.textContent = objectLabel(obj);
    bubble.appendChild(tag);
  }
  if (text) {
    const t = document.createElement("div");
    t.textContent = text;
    bubble.appendChild(t);
  }

  row.appendChild(av);
  row.appendChild(bubble);
  msgs.appendChild(row);
  scrollBottom();
  return row;
}

function showTyping() {
  clearEmpty();
  const row = document.createElement("div");
  row.className = "row bot";
  row.id = "typingRow";
  row.innerHTML = `<div class="avatar">AI</div>
    <div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>`;
  msgs.appendChild(row);
  scrollBottom();
}

function hideTyping() {
  const row = $("typingRow");
  if (row) row.remove();
}

// ── 发送 ──────────────────────────────────────────────────────────────────
async function send(text, obj) {
  if (busy) return;
  const payload = { sender_id: senderId };
  if (text) payload.text = text;
  if (obj) payload.object = { type: obj.type, id: obj.id, title: obj.title || null };

  appendMessage("user", text || "", obj);
  busy = true;
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    hideTyping();
    for (const m of data.messages || []) {
      if (m.text || m.object) appendMessage("bot", m.text || "", m.object);
    }
  } catch (err) {
    hideTyping();
    appendMessage("bot", "抱歉，服务暂时不可用，请确认后端已启动。（" + err.message + "）");
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// ── 历史 ──────────────────────────────────────────────────────────────────
async function loadHistory() {
  try {
    const res = await fetch(`${API}/api/chat/history?sender_id=${encodeURIComponent(senderId)}`);
    const data = await res.json();
    const list = data.messages || [];
    if (!list.length) { renderWelcome(); return; }

    msgs.innerHTML = "";
    document.body.classList.add("has-msgs");
    for (const m of list) {
      appendMessage(m.role === "user" ? "user" : "bot", m.text || "", m.object || null);
    }
    scrollBottom();
  } catch (e) {
    msgs.innerHTML = `<div class="empty"><p>历史加载失败：${escapeHtml(e.message)}</p></div>`;
  }
}

// ── 右侧对象区 ────────────────────────────────────────────────────────────
const STATUS_LABEL = {
  pending: ["待付款", "b-warn"],
  paid: ["待发货", "b-warn"],
  shipped: ["已发货", "b-info"],
  in_transit: ["运输中", "b-info"],
  delivered: ["已签收", "b-ok"],
  completed: ["已完成", "b-ok"],
  canceled: ["已取消", "b-gray"],
};

function thumb(text, colors) {
  const [c1, c2, fg] = colors;
  return `<div class="thumb" style="background:linear-gradient(140deg,${c1},${c2});color:${fg}">${escapeHtml(text)}</div>`;
}

function orderCard(o) {
  const el = document.createElement("div");
  const [label, badgeClass] = STATUS_LABEL[o.status] || [o.status_desc || o.status, "b-gray"];
  el.className = "obj-card";

  const items = (o.items || []).map((i) => i.title_snapshot).filter(Boolean);
  const title = items.join("、") || o.order_number;
  const colors = STATUS_COLORS[o.status] || ["#f5f5f4", "#e7e5e4", "#57534e"];

  el.innerHTML = `
    ${thumb(title.slice(0, 1), colors)}
    <div class="obj-main">
      <div class="obj-line">
        <span class="obj-name">${escapeHtml(title)}</span>
        <span class="badge ${badgeClass}">${escapeHtml(label)}</span>
      </div>
      <div class="obj-meta">
        <span class="price">¥${Number(o.amount || 0).toFixed(0)}</span>
        <span class="no">${escapeHtml(o.order_number)}</span>
      </div>
    </div>
    <div class="obj-cta">发给客服
      <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </div>`;
  el.onclick = () => send(null, { type: "order", id: o.order_number, title });
  return el;
}

function productCard(p) {
  const el = document.createElement("div");
  el.className = "obj-card";
  const soldOut = (p.stock || 0) <= 0;
  const colors = CAT_COLORS[p.category] || ["#f5f5f4", "#e7e5e4", "#57534e"];

  el.innerHTML = `
    ${thumb((p.name || "商").slice(0, 1), colors)}
    <div class="obj-main">
      <div class="obj-line">
        <span class="obj-name">${escapeHtml(p.name)}</span>
        <span class="badge ${soldOut ? "b-gray" : "b-ok"}">${soldOut ? "缺货" : "有货"}</span>
      </div>
      <div class="obj-meta">
        <span class="price">¥${Number(p.price || 0).toFixed(0)}</span>
        <span class="no">${escapeHtml(p.category || "")}</span>
      </div>
    </div>
    ${p.description ? `<div class="obj-desc">${escapeHtml(p.description)}</div>` : ""}
    <div class="obj-cta">发给客服
      <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </div>`;
  el.onclick = () => send(null, { type: "product", id: p.id, title: p.name });
  return el;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadObjects() {
  const body = $("sideBody");
  body.innerHTML = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
  try {
    const [orders, products] = await Promise.all([
      fetch(`${COMMERCE}/users/${senderId}/orders`).then((r) => r.json()),
      fetch(`${COMMERCE}/users/${senderId}/products`).then((r) => r.json()),
    ]);
    const os = orders.data || [];
    const ps = products.data || [];
    $("objCount").textContent = os.length + ps.length;

    body.innerHTML = "";
    if (!os.length && !ps.length) {
      body.innerHTML = `<div class="side-empty">该用户暂无订单或商品</div>`;
      return;
    }
    if (os.length) {
      const t = document.createElement("div");
      t.className = "group-title";
      t.textContent = `我的订单 ${os.length}`;
      body.appendChild(t);
      os.forEach((o) => body.appendChild(orderCard(o)));
    }
    if (ps.length) {
      const t = document.createElement("div");
      t.className = "group-title";
      t.textContent = `最近浏览商品 ${ps.length}`;
      body.appendChild(t);
      ps.forEach((p) => body.appendChild(productCard(p)));
    }
  } catch (e) {
    body.innerHTML = `<div class="side-empty">对象加载失败<br>请确认电商中台已启动<br><span style="color:#a8a29e">${COMMERCE}</span></div>`;
  }
}

// ── 用户切换 ──────────────────────────────────────────────────────────────
async function loadUsers() {
  const sel = $("userSel");
  try {
    const res = await fetch(`${COMMERCE}/users`).then((r) => r.json());
    const users = res.data || [];
    sel.innerHTML = users
      .map((u) => `<option value="${u.id}">${escapeHtml(u.name)} · ${u.id}</option>`)
      .join("");
    if (users.length) senderId = users[0].id;
  } catch (e) {
    sel.innerHTML = `<option>中台未连接</option>`;
  }
}

// ── 事件绑定 ──────────────────────────────────────────────────────────────
function bind() {
  const chips = $("chips");
  QUICK.forEach((q) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = q;
    b.onclick = () => send(q, null);
    chips.appendChild(b);
  });

  sendBtn.onclick = () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    send(text, null);
  };

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 132) + "px";
  });
  // 聚焦时整个输入容器高亮，视觉焦点更明确
  input.addEventListener("focus", () => $("composerBox").classList.add("focused"));
  input.addEventListener("blur", () => $("composerBox").classList.remove("focused"));

  $("userSel").onchange = async (e) => {
    senderId = e.target.value;
    await Promise.all([loadHistory(), loadObjects()]);
  };
}

// ── 启动 ──────────────────────────────────────────────────────────────────
async function loadMeta() {
  try {
    const m = await fetch(`${API}/api/meta`).then((r) => r.json());
    $("modelTag").textContent = m.offline ? "本地规则引擎" : "大模型已接入";
  } catch (e) { /* 后端没起也不阻塞页面 */ }
}

(async function boot() {
  bind();
  renderWelcome();
  await loadMeta();
  await loadUsers();
  await Promise.all([loadHistory(), loadObjects()]);
  input.focus();
})();
</script>
</body>
</html>
